<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Requirement Documents (PRD)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0; padding: 0; background: #f7f7f7; color: #222;
    }
    main {
      max-width: 700px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 24px rgba(0,0,0,0.04);
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-top: 0;
    }
    .btn {
      display: inline-block;
      background: #2d4a89;
      color: #fff;
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      transition: transform .05s ease, box-shadow .2s ease, background .2s ease;
      margin-bottom: 1rem;
    }
    .btn:hover { background:#3558a3; box-shadow: 0 4px 14px rgba(0,0,0,0.16); }
    .btn:active { transform: translateY(1px); }
    .prd-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Product Requirement Documents (PRD)</h1>
    <div class="prd-list">
      <a class="btn" href="PRD/ImproveCRRUrbanCompany_SriHariM_PRD1.pdf" target="_blank">Improve CRR - Urban Company</a>
